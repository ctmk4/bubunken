<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル掲示板</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-item {
            background: #f9f9f9;
            padding: 15px;
            border-left: 5px solid #4CAF50;
            border-radius: 4px;
        }
        .message-header {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        .message-name {
            font-weight: bold;
            color: #222;
        }
        .message-time {
            font-size: 0.8em;
            margin-left: 10px;
        }
        .message-body {
            margin: 0;
            line-height: 1.5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>シンプル掲示板</h1>
    
    <!-- 投稿フォーム -->
    <div class="form-group">
        <input type="text" id="nameInput" placeholder="名前（省略可）" maxlength="20">
        <textarea id="messageInput" placeholder="メッセージを入力してください..." required></textarea>
        <button id="submitBtn">投稿する</button>
    </div>

    <!-- 投稿一覧 -->
    <div id="messageList" class="message-list">
        <!-- ここにメッセージが追加されます -->
    </div>
</div>

<script type="module">
  // Firebaseのコア機能とアナリティクスをインポート
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
  // Firestoreの機能をインポート
  import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  // 提供されたFirebaseの設定
  const firebaseConfig = {
    apiKey: "AIzaSyB6oDIqTqR87Mv5Cqo3tVud2tZLGmP982E",
    authDomain: "sotuken-47c08.firebaseapp.com",
    projectId: "sotuken-47c08",
    storageBucket: "sotuken-47c08.firebasestorage.app",
    messagingSenderId: "495973514160",
    appId: "1:495973514160:web:fa3996da883dc6979a7475",
    measurementId: "G-9F2J0CVNV7"
  };

  // Firebaseの初期化
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  
  // Firestoreの初期化
  const db = getFirestore(app);

  // Firestoreの「messages」コレクションへの参照
  const messagesRef = collection(db, 'messages');
  
  // 投稿を新しい順に並べるクエリ
  const q = query(messagesRef, orderBy('createdAt', 'desc'));

  // DOM要素の取得
  const messageList = document.getElementById('messageList');
  const nameInput = document.getElementById('nameInput');
  const messageInput = document.getElementById('messageInput');
  const submitBtn = document.getElementById('submitBtn');

  // XSS対策（HTMLエスケープ）関数
  const escapeHTML = (str) => {
      return str.replace(/[&<>'"]/g, 
          tag => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              "'": '&#39;',
              '"': '&quot;'
          }[tag])
      );
  };

  // リアルタイムでデータを取得して画面に表示
  onSnapshot(q, (snapshot) => {
      messageList.innerHTML = ''; // 一旦リストをクリア
      
      snapshot.forEach((doc) => {
          const data = doc.data();
          const div = document.createElement('div');
          div.className = 'message-item';
          
          const name = data.name ? escapeHTML(data.name) : '名無しさん';
          const text = data.text ? escapeHTML(data.text) : '';
          
          // タイムスタンプの処理（投稿直後はnullになる対策）
          let timeString = '送信中...';
          if (data.createdAt) {
              const date = data.createdAt.toDate();
              timeString = `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
          }

          div.innerHTML = `
              <div class="message-header">
                  <span class="message-name">${name}</span>
                  <span class="message-time">${timeString}</span>
              </div>
              <p class="message-body">${text}</p>
          `;
          messageList.appendChild(div);
      });
  });

  // 投稿ボタンクリック時の処理
  submitBtn.addEventListener('click', async () => {
      const text = messageInput.value.trim();
      const name = nameInput.value.trim();

      if (!text) {
          alert('メッセージを入力してください。');
          return;
      }

      // ボタンを連打できないように無効化
      submitBtn.disabled = true;

      try {
          // Firestoreにデータを追加
          await addDoc(messagesRef, {
              name: name,
              text: text,
              createdAt: serverTimestamp() // サーバーの時間を取得
          });
          
          // 入力欄をクリア
          messageInput.value = '';
      } catch (error) {
          console.error("エラーが発生しました: ", error);
          alert("投稿に失敗しました。データベースの設定（セキュリティルール）を確認してください。");
      } finally {
          // ボタンを有効化
          submitBtn.disabled = false;
      }
  });
</script>

</body>
</html>
